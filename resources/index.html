<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlfyChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
  <style>
    /* ════════════════════════════════════════════════════════════════════
       Jetons — repris de alfy-theme.css (mode sombre) pour que le shell
       desktop et l'application soient rigoureusement de la même couleur.
       Aucune bordure dans cette interface : les zones se séparent par le
       fond et l'espacement, jamais par un trait.
       ════════════════════════════════════════════════════════════════════ */
    :root {
      --bg:         oklch(14.5% 0.006 293);
      --surface:    oklch(18%   0.007 293);
      --surface-2:  oklch(21.5% 0.009 293);
      --surface-3:  oklch(25%   0.011 293);
      --accent:     oklch(64%   0.24  293);
      --accent-fg:  oklch(99.5% 0     0);
      --text:       oklch(96%   0.004 293);
      --muted:      oklch(66%   0.014 293);
      --danger:     oklch(63%   0.2   26);
      --warning:    oklch(80%   0.15  78);

      --r-sm: 10px;
      --r-md: 16px;
      --r-lg: 24px;

      --ease: cubic-bezier(0.22, 1, 0.36, 1);
      --titlebar-h: 36px;
    }

    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button { font: inherit; color: inherit; cursor: pointer; border: none; background: none; }

    /* ── Animations partagées ─────────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-100%); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes indeterminate {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(300%); }
    }
    .fade-up { animation: fadeUp 420ms var(--ease) both; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    #app-root { position: fixed; inset: 0; background: var(--bg); overflow: hidden; }

    /* ════════════════════════════════════════════
       BARRE DE TITRE — overlay natif Electron
    ════════════════════════════════════════════ */
    #titlebar {
      position: absolute; top: 0; left: 0; right: 0;
      height: var(--titlebar-h); z-index: 400;
      display: flex; align-items: center; gap: 9px;
      padding-left: 14px;
      background: var(--bg);
      user-select: none;
      -webkit-app-region: drag;
    }
    #titlebar img { width: 15px; height: 15px; flex-shrink: 0; pointer-events: none; }
    #titlebar .name {
      font-family: 'Krona One', sans-serif;
      font-size: 11px; letter-spacing: 0.06em;
      color: var(--muted); pointer-events: none;
    }
    /* Pastille DEV — seul repère visuel du mode local */
    #dev-badge {
      display: none;
      font-size: 10px; font-weight: 600; letter-spacing: 0.04em;
      color: var(--bg); background: var(--warning);
      padding: 2px 7px; border-radius: 99px;
      pointer-events: none;
    }
    #dev-badge.show { display: inline-block; }

    /* ════════════════════════════════════════════
       SPLASH
    ════════════════════════════════════════════ */
    #splash {
      position: absolute; top: var(--titlebar-h); left: 0; right: 0; bottom: 0; z-index: 100;
      background: var(--bg);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 40px;
      transition: opacity 420ms var(--ease);
    }
    #splash.hidden { opacity: 0; pointer-events: none; }

    .wordmark { animation: fadeUp 500ms var(--ease) both; }
    .wordmark img { width: 300px; height: auto; display: block; }

    .boot {
      width: 200px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
      animation: fadeUp 500ms var(--ease) 120ms both;
    }
    .track {
      position: relative;
      width: 100%; height: 2px;
      background: var(--surface-2);
      border-radius: 99px; overflow: hidden;
    }
    #bar {
      height: 100%; width: 0%;
      background: var(--accent);
      border-radius: 99px;
      transition: width 500ms var(--ease);
    }
    /* Le serveur peut être lent à démarrer : barre indéterminée en attendant */
    .track.pending::after {
      content: '';
      position: absolute; inset: 0 auto 0 0;
      width: 33%; background: var(--accent);
      border-radius: 99px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }
    #status { font-size: 12px; color: var(--muted); min-height: 16px; }

    /* ════════════════════════════════════════════
       BANDEAU DE MISE À JOUR
    ════════════════════════════════════════════ */
    #update {
      display: none;
      position: absolute; top: var(--titlebar-h); left: 0; right: 0; z-index: 200;
      background: var(--surface-2);
      padding: 10px 16px;
      align-items: center; gap: 12px;
      animation: slideDown 320ms var(--ease) both;
    }
    #update.show { display: flex; }
    #update .dot {
      width: 7px; height: 7px; border-radius: 99px;
      background: var(--accent); flex-shrink: 0;
    }
    #update-text { flex: 1; min-width: 0; font-size: 13px; color: var(--text); }
    .btn {
      padding: 6px 14px; border-radius: var(--r-sm);
      font-size: 12px; font-weight: 500; white-space: nowrap;
      transition: background 160ms var(--ease), transform 120ms var(--ease);
    }
    .btn:active { transform: scale(0.97); }
    .btn-primary { background: var(--accent); color: var(--accent-fg); }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-ghost { background: transparent; color: var(--muted); }
    .btn-ghost:hover { background: var(--surface-3); color: var(--text); }

    /* ════════════════════════════════════════════
       ÉCRAN D'ERREUR
    ════════════════════════════════════════════ */
    #error {
      display: none;
      position: absolute; top: var(--titlebar-h); left: 0; right: 0; bottom: 0; z-index: 150;
      background: var(--bg);
      flex-direction: column; align-items: center; justify-content: center;
      padding: 32px;
    }
    #error.show { display: flex; }

    .card {
      width: 100%; max-width: 440px;
      background: var(--surface);
      border-radius: var(--r-lg);
      padding: 32px;
      display: flex; flex-direction: column; gap: 18px;
      animation: fadeUp 360ms var(--ease) both;
    }
    .card h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
    .card p  { font-size: 13px; line-height: 1.6; color: var(--muted); }

    .glyph {
      width: 46px; height: 46px; border-radius: var(--r-md);
      background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
    }

    #error-detail {
      background: var(--bg);
      border-radius: var(--r-md);
      padding: 14px;
      font-family: 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace;
      font-size: 11.5px; line-height: 1.65; color: var(--muted);
      white-space: pre-wrap; word-break: break-word;
    }

    /* Aide affichée seulement en dev : la cause est presque toujours la même */
    #error-hint {
      display: none;
      background: var(--surface-2);
      border-radius: var(--r-md);
      padding: 14px;
      font-size: 12px; line-height: 1.65; color: var(--text);
    }
    #error-hint.show { display: block; }
    #error-hint code {
      font-family: 'Cascadia Code', 'Fira Code', Menlo, Consolas, monospace;
      font-size: 11.5px;
      background: var(--bg); border-radius: 6px; padding: 2px 6px;
    }

    .card-actions { display: flex; gap: 8px; }
    .card-actions .btn { flex: 1; padding: 10px 16px; font-size: 13px; text-align: center; }

    /* ════════════════════════════════════════════
       FRONTEND EMBARQUÉ
    ════════════════════════════════════════════ */
    #view {
      position: absolute; top: var(--titlebar-h); left: 0; right: 0; bottom: 0;
      opacity: 0; transition: opacity 420ms var(--ease);
    }
    #view.visible { opacity: 1; }
    #view webview { width: 100%; height: 100%; display: flex; background: var(--bg); }
  </style>
</head>
<body>
<div id="app-root">

  <!-- ── Barre de titre ─────────────────────────────────────────────── -->
  <div id="titlebar">
    <img src="icons/logo/Alfychat.svg" alt="" />
    <span class="name">ALFYCHAT</span>
    <span id="dev-badge">DEV</span>
  </div>

  <!-- ── Splash ─────────────────────────────────────────────────────── -->
  <div id="splash">
    <div class="wordmark">
      <img src="icons/logo/Alfychatlogotitleupwihte.svg" alt="AlfyChat" />
    </div>
    <div class="boot">
      <div class="track" id="track"><div id="bar"></div></div>
      <span id="status">Initialisation…</span>
    </div>
  </div>

  <!-- ── Mise à jour ────────────────────────────────────────────────── -->
  <div id="update">
    <span class="dot"></span>
    <span id="update-text"></span>
    <button class="btn btn-primary" id="btn-install">Redémarrer et installer</button>
    <button class="btn btn-ghost" id="btn-dismiss">Plus tard</button>
  </div>

  <!-- ── Erreur ─────────────────────────────────────────────────────── -->
  <div id="error">
    <div class="card">
      <div class="glyph">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"
             style="color: var(--danger)">
          <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <circle cx="12" cy="17" r="0.5" fill="currentColor"/>
        </svg>
      </div>

      <div>
        <h1>Impossible de démarrer</h1>
        <p id="error-lead">AlfyChat n’a pas pu contacter le frontend.</p>
      </div>

      <div id="error-hint">
        Le serveur de développement ne répond pas. Lancez-le puis réessayez :<br />
        <code>cd Frontend-AlfyChat-newui &amp;&amp; bun dev</code>
      </div>

      <div id="error-detail"></div>

      <div class="card-actions">
        <button class="btn btn-primary" id="btn-retry">Réessayer</button>
        <button class="btn btn-ghost" id="btn-open-external">Ouvrir dans le navigateur</button>
      </div>
    </div>
  </div>

  <!-- ── Frontend — le <webview> est créé par app.js (partition dev/prod) ── -->
  <div id="view"></div>

</div>
<script src="js/app.js"></script>
</body>
</html>
