<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AlfyChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Krona+One&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:          #09090b;
      --surface:     #18181b;
      --surface-2:   #1c1c1f;
      --border:      #27272a;
      --border-soft: #202023;
      --accent:      #6366f1;
      --accent-hv:   #4f46e5;
      --accent-dim:  rgba(99,102,241,0.12);
      --text:        #fafafa;
      --text-2:      #a1a1aa;
      --muted:       #52525b;
      --error:       #ef4444;
      --error-dim:   rgba(239,68,68,0.12);
      --radius:      12px;
      --radius-sm:   8px;
    }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
.krona-one-regular {
  font-family: "Krona One", sans-serif;
  font-weight: 400;
  font-style: normal;
}

    /* Wrapper principal arrondi */
    #app-root {
      position: fixed; inset: 0;
      background: var(--bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.08),
        0 32px 64px rgba(0,0,0,0.6),
        0 8px 24px rgba(0,0,0,0.4);
    }

    /* ════════════════════════════════════════════
       SPLASH
    ════════════════════════════════════════════ */
    #splash {
      position: absolute; top: 32px; left: 0; right: 0; bottom: 0; z-index: 100;
      background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      transition: opacity 0.5s ease;
    }
    #splash.fade-out { opacity: 0; pointer-events: none; }

    .splash-content {
      display: flex; flex-direction: column;
      align-items: center; gap: 32px;
      animation: splashIn 0.5s cubic-bezier(0.16,1,0.3,1) both;
    }
    @keyframes splashIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Logo icon */
    .splash-icon-ring {
      position: relative;
      width: 88px; height: 88px;
      display: flex; align-items: center; justify-content: center;
    }
    .splash-icon-ring::before {
      content: '';
      position: absolute; inset: -8px;
      background: radial-gradient(circle, rgba(99,102,241,0.18) 0%, transparent 70%);
      border-radius: 50%;
      animation: glowPulse 2.8s ease-in-out infinite;
    }
    @keyframes glowPulse {
      0%,100% { opacity: 0.5; transform: scale(0.9); }
      50%      { opacity: 1;   transform: scale(1.1); }
    }
    .splash-icon-wrap {
      width: 80px; height: 80px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      display: flex; align-items: center; justify-content: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04),
        0 4px 24px rgba(0,0,0,0.4),
        inset 0 1px 0 rgba(255,255,255,0.06);
    }
    .splash-icon-wrap img {
      width: 44px; height: 44px;
      filter: drop-shadow(0 2px 8px rgba(99,102,241,0.4));
    }

    /* Wordmark */
    .splash-wordmark img {
      width: 400px;
      height: auto;
      opacity: 0.92;
    }

    /* Progress */
    .splash-progress {
      display: flex; flex-direction: column;
      align-items: center; gap: 10px;
      width: 240px;
    }
    .progress-track {
      width: 100%; height: 2px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
    }
    #progress {
      height: 100%; width: 0%;
      background: linear-gradient(90deg, var(--accent), #a78bfa, #818cf8);
      background-size: 200% 100%;
      border-radius: 99px;
      transition: width 0.45s cubic-bezier(0.4,0,0.2,1);
      animation: shimmer 2s linear infinite;
    }
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    #splash-status {
      font-size: 11.5px;
      color: var(--muted);
      letter-spacing: 0.02em;
      min-height: 16px;
    }

    /* ════════════════════════════════════════════
       UPDATE BANNER
    ════════════════════════════════════════════ */
    #update-banner {
      display: none;
      position: absolute; top: 32px; left: 0; right: 0; z-index: 200;
      background: var(--surface-2);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      align-items: center; justify-content: space-between; gap: 12px;
    }
    #update-banner.show { display: flex; }

    .update-left {
      display: flex; align-items: center; gap: 10px;
    }
    .update-pill {
      display: inline-flex; align-items: center; gap: 5px;
      background: var(--accent-dim);
      color: #a5b4fc;
      border: 1px solid rgba(99,102,241,0.25);
      border-radius: 99px;
      padding: 2px 9px; font-size: 11px; font-weight: 500;
      white-space: nowrap;
    }
    #update-text {
      font-size: 13px;
      color: var(--text-2);
    }
    .update-actions { display: flex; gap: 8px; align-items: center; }

    .btn-install {
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      padding: 5px 14px; font-size: 12px; font-weight: 500;
      cursor: pointer; transition: background 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .btn-install:hover { background: var(--accent-hv); }

    .btn-later {
      background: transparent; color: var(--text-2);
      border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 5px 12px; font-size: 12px; cursor: pointer;
      transition: color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .btn-later:hover { color: var(--text); border-color: #3f3f46; }

    /* ════════════════════════════════════════════
       ERROR SCREEN
    ════════════════════════════════════════════ */
    #error-screen {
      display: none;
      position: absolute; top: 32px; left: 0; right: 0; bottom: 0; z-index: 150;
      background: var(--bg);
      flex-direction: column;
      align-items: center; justify-content: center;
      padding: 32px;
    }
    #error-screen.show { display: flex; }

    .error-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 36px 40px 32px;
      display: flex; flex-direction: column;
      align-items: center; gap: 14px;
      max-width: 420px; width: 100%;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.03),
        0 24px 48px rgba(0,0,0,0.5);
      animation: cardIn 0.3s ease both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: scale(0.97) translateY(8px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    .error-icon-box {
      width: 52px; height: 52px;
      background: var(--error-dim);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .error-logo {
      height: 18px;
      opacity: 0.4;
      margin-bottom: 2px;
    }

    .error-title-text {
      font-size: 16px; font-weight: 600;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .error-subtitle {
      font-size: 13px;
      color: var(--text-2);
      line-height: 1.55;
      max-width: 320px;
    }

    .error-code-wrap {
      width: 100%;
      background: #0d0d10;
      border: 1px solid var(--border-soft);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      text-align: left;
    }
    #error-detail {
      font-size: 11.5px;
      color: #71717a;
      font-family: 'Cascadia Code', 'Fira Code', 'Menlo', 'Consolas', monospace;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .btn-retry {
      width: 100%;
      background: var(--accent); color: #fff;
      border: none; border-radius: var(--radius-sm);
      padding: 10px 16px;
      font-size: 14px; font-weight: 500;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      margin-top: 2px;
    }
    .btn-retry:hover  { background: var(--accent-hv); }
    .btn-retry:active { transform: scale(0.98); }

    .error-divider {
      width: 100%; height: 1px;
      background: var(--border-soft);
    }

    /* ════════════════════════════════════════════
       TITLEBAR — overlay natif Electron
    ════════════════════════════════════════════ */
    #titlebar {
      position: absolute; top: 0; left: 0; right: 0;
      height: 32px; z-index: 400;
      display: flex; align-items: center;
      padding-left: 12px; gap: 7px;
      user-select: none;
      -webkit-app-region: drag;
    }
    #titlebar img.tb-icon { width: 16px; height: 16px; flex-shrink: 0; pointer-events: none; }
    #titlebar .tb-name {
      font-size: 12px; font-weight: 500;
      color: var(--text-2); letter-spacing: 0.01em;
      pointer-events: none;
    }

    /* ════════════════════════════════════════════
       APP WEBVIEW
    ════════════════════════════════════════════ */
    #webview-container {
      position: absolute; top: 32px; left: 0; right: 0; bottom: 0;
      opacity: 0; transition: opacity 0.4s ease;
    }
    #webview-container.visible { opacity: 1; }

    iframe#app-frame {
      width: 100%; height: 100%; border: none;
      display: block; background: var(--bg);
    }
  </style>
</head>
<body>
<div id="app-root">

<!-- ── Splash ─────────────────────────────────────────────── -->
<div id="splash">
  <div class="splash-content">



    <div class="splash-wordmark">
      <img src="icons/logo/Alfychatlogotitleupwihte.svg" alt="AlfyChat" />
    </div>

    <div class="splash-progress">
      <div class="progress-track">
        <div id="progress"></div>
      </div>
      <span id="splash-status">Initialisation…</span>
    </div>

  </div>
</div>

<!-- ── Update banner ─────────────────────────────────────── -->
<div id="update-banner">
  <div class="update-left">
    <span class="update-pill">
      <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
      Mise à jour
    </span>
    <span id="update-text"></span>
  </div>
  <div class="update-actions">
    <button class="btn-install" id="btn-install-update">Installer et redémarrer</button>
    <button class="btn-later"   id="btn-dismiss-update">Plus tard</button>
  </div>
</div>

<!-- ── Error screen ───────────────────────────────────────── -->
<div id="error-screen">
  <div class="error-card">

    <div class="error-icon-box">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <circle cx="12" cy="17" r="0.5" fill="#ef4444"/>
      </svg>
    </div>

    <div>
      <div class="error-title-text">Impossible de démarrer</div>
    </div>

    <div class="error-subtitle">
      AlfyChat n'a pas pu contacter le serveur frontend.
    </div>

    <div class="error-divider"></div>

    <div class="error-code-wrap">
      <div id="error-detail">Le frontend AlfyChat n'a pas pu être contacté.</div>
    </div>

    <button class="btn-retry" onclick="retryLoad()">Réessayer la connexion</button>

    <img class="error-logo" src="icons/logo/Alfychatlogotitleupwihte.svg" alt="AlfyChat" />

  </div>
</div>

<!-- ── Titlebar ─────────────────────────────────────────── -->
<div id="titlebar">
  <img class="tb-icon" src="icons/logo/Alfychat.svg" alt="" />
  <span class="tb-name krona-one-regular">ALFYCHAT</span>
</div>

<!-- ── App webview ────────────────────────────────────────── -->
<div id="webview-container">
  <webview id="app-frame" allowpopups
    partition="persist:alfychat"
    webpreferences="contextIsolation=no"
    style="width:100%;height:100%;display:flex;">
  </webview>
</div>

<script src="js/updater.js"></script>
<script src="js/app.js"></script>
</div><!-- #app-root -->
</body>
</html>
