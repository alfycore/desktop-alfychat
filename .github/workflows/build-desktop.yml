name: Build & Release Desktop

# Déclenché par :
#   - git push sur la branche main (seulement si la version n'est pas déjà publiée)
#   - bouton "Run workflow" dans l'onglet Actions (toujours)
# La version est toujours lue depuis package.json
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Marquer comme pré-release ?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  # ── Lecture de la version depuis package.json ─────────────────────────────────
  prepare:
    name: Préparer la version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      skip: ${{ steps.resolve.outputs.skip }}

    steps:
      - uses: actions/checkout@v4
      - name: Lire la version depuis package.json
        id: resolve
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "Version lue : $VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          # Sur un push, une version déjà publiée n'est pas reconstruite : les
          # clients installés ne verraient rien (même numéro) et les binaires de
          # la release changeraient sous le même nom.
          if [ "${{ github.event_name }}" = "push" ] && git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::notice::${TAG} est déjà publiée : build ignoré. Augmenter la version dans package.json pour publier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  # ── Windows (NSIS .exe) ───────────────────────────────────────────────────────
  build-windows:
    name: Windows (exe)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Build Windows (NSIS)
        run: npm run build:win -- --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfychat-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  # ── macOS (DMG x64 + arm64) ───────────────────────────────────────────────────
  build-macos:
    name: macOS (dmg)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Build macOS (DMG)
        run: npm run build:mac -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Pour signer avec un certificat Apple Developer, ajouter ces secrets :
          # CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfychat-macos
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error

  # ── Linux (deb + AppImage) ────────────────────────────────────────────────────
  # electron-builder télécharge lui-même ses outils (fpm, appimagetool) : aucun
  # paquet système n'est nécessaire pour construire.
  build-linux:
    name: Linux (deb + AppImage)
    needs: prepare
    if: needs.prepare.outputs.skip != 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --no-audit --no-fund

      - name: Build Linux (deb + AppImage)
        run: npm run build:linux -- --publish never

      - name: Upload artifact deb
        uses: actions/upload-artifact@v4
        with:
          name: alfychat-linux-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload artifact AppImage
        uses: actions/upload-artifact@v4
        with:
          name: alfychat-linux-appimage
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [prepare, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success'

    steps:
      - name: Télécharger tous les artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Créer le tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.prepare.outputs.tag }}';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              console.log(`Tag ${tag} créé.`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Tag ${tag} existe déjà, on continue.`);
              } else { throw e; }
            }

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AlfyChat Desktop ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          draft: false
          files: |
            artifacts/alfychat-windows/*.exe
            artifacts/alfychat-windows/latest.yml
            artifacts/alfychat-macos/*.dmg
            artifacts/alfychat-macos/latest-mac.yml
            artifacts/alfychat-linux-deb/*.deb
            artifacts/alfychat-linux-appimage/*.AppImage
            artifacts/alfychat-linux-appimage/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
