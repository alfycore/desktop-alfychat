name: Build & Release Desktop

# Déclenché par :
#   - git push sur la branche main
#   - bouton "Run workflow" dans l'onglet Actions
# La version est toujours lue depuis package.json
on:
  push:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Marquer comme pré-release ?'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

permissions:
  contents: write

jobs:
  # ── Lecture de la version depuis package.json ─────────────────────────────────
  prepare:
    name: Préparer la version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      - name: Lire la version depuis package.json
        id: resolve
        run: |
          VERSION=$(node -e "console.log(require('./package.json').version)")
          echo "Version lue : $VERSION"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}"   >> "$GITHUB_OUTPUT"

  # ── Windows (NSIS .exe) ───────────────────────────────────────────────────────
  build-windows:
    name: Windows (exe)
    needs: prepare
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mettre à jour la version dans package.json
        shell: pwsh
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $pkg.version = "${{ needs.prepare.outputs.version }}"
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json

      - name: Installer les dépendances
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci || { echo 'npm ci a échoué, fallback vers npm install'; npm install --no-audit --no-fund; }
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Windows (NSIS)
        run: npm run build:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfychat-windows
          path: |
            dist/*.exe
            dist/latest.yml
          if-no-files-found: error

  # ── macOS (DMG x64 + arm64) ───────────────────────────────────────────────────
  build-macos:
    name: macOS (dmg)
    needs: prepare
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mettre à jour la version dans package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Installer les dépendances
        run: |
          if [ -f package-lock.json ]; then
            npm ci || { echo 'npm ci a échoué, fallback vers npm install'; npm install --no-audit --no-fund; }
          else
            npm install --no-audit --no-fund
          fi

      - name: Build macOS (DMG)
        run: npm run build:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          # Pour signer avec un certificat Apple Developer, ajouter ces secrets :
          # CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          # CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alfychat-macos
          path: |
            dist/*.dmg
            dist/latest-mac.yml
          if-no-files-found: error

  # ── Linux (deb + AppImage) ────────────────────────────────────────────────────
  build-linux:
    name: Linux (deb + AppImage)
    needs: prepare
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances système
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            libgtk-3-dev \
            libnotify-dev \
            libnss3 \
            libxss1 \
            libxtst-dev \
            libsecret-1-dev \
            rpm

      - name: Mettre à jour la version dans package.json
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

      - name: Installer les dépendances
        run: |
          if [ -f package-lock.json ]; then
            npm ci || { echo 'npm ci a échoué, fallback vers npm install'; npm install --no-audit --no-fund; }
          else
            npm install --no-audit --no-fund
          fi

      - name: Build Linux (deb + AppImage)
        run: npm run build:linux

      - name: Upload artifact deb
        uses: actions/upload-artifact@v4
        with:
          name: alfychat-linux-deb
          path: dist/*.deb
          if-no-files-found: error

      - name: Upload artifact AppImage
        uses: actions/upload-artifact@v4
        with:
          name: alfychat-linux-appimage
          path: |
            dist/*.AppImage
            dist/latest-linux.yml
          if-no-files-found: error

  # ── GitHub Release ────────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [prepare, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always() && needs.build-windows.result == 'success' && needs.build-macos.result == 'success' && needs.build-linux.result == 'success'

    steps:
      - name: Télécharger tous les artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Créer le tag
        uses: actions/github-script@v7
        with:
          script: |
            const tag = '${{ needs.prepare.outputs.tag }}';
            try {
              await github.rest.git.createRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `refs/tags/${tag}`,
                sha: context.sha,
              });
              console.log(`Tag ${tag} créé.`);
            } catch (e) {
              if (e.status === 422) {
                console.log(`Tag ${tag} existe déjà, on continue.`);
              } else { throw e; }
            }

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AlfyChat Desktop ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          draft: false
          files: |
            artifacts/alfychat-windows/*.exe
            artifacts/alfychat-windows/latest.yml
            artifacts/alfychat-macos/*.dmg
            artifacts/alfychat-macos/latest-mac.yml
            artifacts/alfychat-linux-deb/*.deb
            artifacts/alfychat-linux-appimage/*.AppImage
            artifacts/alfychat-linux-appimage/latest-linux.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
